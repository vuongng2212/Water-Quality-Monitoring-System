version: "3.8"

services:
  db:
    image: postgres:16
    container_name: water-quality-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "water_quality_db"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "1111"
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
